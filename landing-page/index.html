<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="author" content="%SEO_AUTHOR%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="application-name" content="Danger Detection" />
    <meta name="apple-mobile-web-app-title" content="Danger Detection" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f3eee7" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Icons and app manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danger Detection" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_SHORT_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Danger Detection: AI-powered fire and smoke detection" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_SHORT_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Danger Detection: AI-powered fire and smoke detection" />

    <!--SEO_JSONLD-->

    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('dd-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111312')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Danger Detection: AI-powered fire and smoke detection</h1>
        <p>%SEO_DESCRIPTION%</p>
        <h2>Features</h2>
        <ul>
          <li>Real-time fire and smoke detection with a fine-tuned YOLO model</li>
          <li>Person tracking with unusual-movement flags</li>
          <li>General COCO object detection</li>
          <li>Instant WebSocket alerts to an installable web app (PWA)</li>
          <li>SQLite event logging</li>
          <li>Runs entirely on your own machine; MIT licensed</li>
        </ul>
        <p>
          Source code, installation guide and documentation:
          <a href="https://github.com/Miftah-Fentaw/Danger-Detection">github.com/Miftah-Fentaw/Danger-Detection</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
